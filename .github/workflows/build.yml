El proceso duró 2 minutos y 1 segundo antes de fallar porque le faltaban las herramientas de compilación de bajo nivel de Linux (**`autoconf`**, **`automake`**, **`libtool`**, **`pkg-config`** y **`cmake`**). Cuando el compilador de Android (*python-for-android*) intentó configurar el núcleo de Python a los 2 minutos, no encontró esas herramientas y se detuvo con el código de error `1`.

Ya he incluido todas esas herramientas requeridas en el código de automatización.

