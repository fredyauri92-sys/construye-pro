### 🛠️ Código Completo y Corregido para `build.yml`

Reemplaza todo el contenido de tu archivo **`.github/workflows/build.yml`** en GitHub por este código completo:

```yaml
name: Build CONSTRUYE.PRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg ccache \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev zip unzip \
          autoconf automake libtool pkg-config cmake lld gettext
        pip install --upgrade pip
        pip install --upgrade buildozer "cython<3.0.0"

    - name: Build APK with Buildozer
      run: |
        BUILDOZER_WARN_ON_ROOT=0 buildozer -v android debug

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: CONSTRUYE_PRO_APK
        path: bin/*.apk
